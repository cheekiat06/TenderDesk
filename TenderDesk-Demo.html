<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TenderDesk — clickable demo for CBM</title>
<style>
:root{--ink:#1F2937;--navy:#143A5C;--navy-d:#0E2A44;--muted:#5B6B7A;--teal:#0E7C86;--teal-d:#0A5C64;--teal-l:#E3F3F4;--amber:#E9A23B;--amber-l:#FCF1DC;--red:#C0392B;--red-l:#F9E3E0;--green:#2E8B57;--green-l:#E3F3EA;--bg:#F3F5F8;--line:#D8DFE7;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--navy);color:#D7E3EE;padding:18px 14px;display:flex;flex-direction:column;gap:5px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.brand b{font-size:17px}.brand small{display:block;color:#9DB4C9;font-size:11px}
.side .lbl{font-size:11px;color:#9DB4C9;padding:12px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;color:#D7E3EE;border:0;background:transparent;text-align:left;width:100%;font:inherit}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--teal);color:#fff}.nav .ic{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--amber);color:#3A2600;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.sync{margin-top:auto;font-size:12px;color:#9DB4C9;padding:10px 8px;border-top:1px solid #27506F}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7FD6C1;margin-right:6px;box-shadow:0 0 0 3px rgba(127,214,193,.25)}
.main{padding:22px 28px 60px;max-width:1260px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.2px}.sub{color:var(--muted);margin-top:3px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.5px}.tile .k{color:var(--muted);font-size:12px}.tile .d{font-size:12px;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal)}.btn.ghost:hover{background:var(--teal-l)}.btn.sm{padding:5px 10px;font-size:12px}.btn.warn{background:var(--red);border-color:var(--red)}.btn.amber{background:var(--amber);border-color:var(--amber);color:#3A2600}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11.5px;font-weight:600;background:#EEF1F5;color:#3D4B5A;white-space:nowrap}
.chip.teal{background:var(--teal-l);color:var(--teal-d)}.chip.amber{background:var(--amber-l);color:#7A4E00}.chip.red{background:var(--red-l);color:#8C271D}.chip.green{background:var(--green-l);color:#1E5F3B}.chip.navy{background:#E1E9F2;color:var(--navy)}
.src{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:#EEF1F5;color:#3D4B5A}.src.GeBIZ{background:#E1E9F2;color:#143A5C}.src.SESAMi{background:#E6F2E8;color:#1E5F3B}.src.TenderBoard{background:#FCE9D8;color:#8C4A00}.src.Ariba{background:#EAE4F7;color:#4E3A8F}.src.Email{background:#EEF1F5;color:#3D4B5A}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:9px 8px;border-bottom:1px solid #EEF1F5;vertical-align:top}.tbl tr:hover td{background:#F7F9FB}.cl{cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}.tab{border:0;background:none;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:var(--teal-d);border-color:var(--teal)}
.drawer{position:fixed;top:0;right:-560px;width:540px;height:100vh;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.12);transition:right .25s;padding:22px 24px;overflow:auto;z-index:20}.drawer.open{right:0}
.x{float:right;border:0;background:#EEF1F5;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px}
.ai{background:var(--amber-l);border:1px dashed #D08A1C;border-radius:10px;padding:10px 12px;margin:10px 0}.ai .h{font-size:11.5px;font-weight:700;color:#7A4E00;margin-bottom:4px}
.cite{display:inline-block;background:#E1E9F2;color:var(--navy);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;cursor:pointer;margin-left:4px}.cite:hover{background:var(--navy);color:#fff}
.q{background:#F7F9FB;border-left:3px solid var(--navy);padding:10px 12px;border-radius:6px;font-size:13px;margin:8px 0}.q small{display:block;color:var(--muted);margin-top:4px}
.bar{height:8px;background:#EEF1F5;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.score{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}.opt.best{border-color:var(--teal);background:#F6FBFB}.opt .rs{color:var(--muted);font-size:12.5px;margin:6px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transition:all .25s;z-index:30;font-weight:600;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.muted{color:var(--muted)}.sm{font-size:12px}.ok{color:var(--green);font-weight:600}.bad{color:#8C271D;font-weight:600}
.note{font-size:12px;color:var(--muted);background:#F7F9FB;border-left:3px solid var(--teal);padding:8px 10px;border-radius:6px;margin:10px 0}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff .o{background:#FBF4F3;border:1px solid #EFCFCB;border-radius:8px;padding:10px;font-size:13px}.diff .n{background:#EFFAF4;border:1px solid #C7E8D4;border-radius:8px;padding:10px;font-size:13px}
del{color:#8C271D;background:#F9E3E0;text-decoration:line-through}ins{color:#1E5F3B;background:#DCF2E6;text-decoration:none;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pb{display:flex;gap:4px;margin:6px 0}.pb i{flex:1;height:6px;border-radius:3px;background:#EEF1F5}.pb i.on{background:var(--teal)}.pb i.w{background:var(--amber)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.tiles,.grid3{grid-template-columns:1fr 1fr}.grid2,.diff,.score{grid-template-columns:1fr}.drawer{width:100%;right:-100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">T</div><div><b>TenderDesk</b><small>CBM · demo</small></div></div>
    <div class="lbl">Workspace</div><div id="nav"></div>
    <div class="sync"><span class="dot"></span>Sources polled <b style="color:#7FD6C1">hourly</b><br><span class="sm">GeBIZ feeds · SESAMi, TenderBoard, Ariba via mailbox · 2 new since 08:00</span></div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<script>
// ---------- synthetic data: every tender, client and figure below is fictional ----------
const S={view:"home",tab:"summary",sel:"T-2611",decided:null,
tenders:[
 {id:"T-2611",src:"GeBIZ",title:"Integrated Facilities Management Services for Northshore Polytechnic Campus",org:"Northshore Polytechnic",lines:["Engineering","Cleaning","Security"],value:"S$8–12m",close:"27 Nov 2026",days:18,rel:92,status:"Screening",type:"ITT"},
 {id:"T-2613",src:"TenderBoard",title:"M&E Maintenance Term Contract — Eastgate Community Hospital",org:"Eastgate Health Group",lines:["Engineering"],value:"S$4–6m",close:"4 Dec 2026",days:25,rel:88,status:"New",type:"Invitation"},
 {id:"T-2612",src:"SESAMi",title:"Security Services for a Commercial Office Portfolio (4 buildings, CBD)",org:"Harbourfront Commercial Trust",lines:["Security"],value:"S$2–3m",close:"20 Nov 2026",days:11,rel:84,status:"In review",type:"Invitation"},
 {id:"T-2616",src:"Email",title:"RFP: Facilities Management for a Data Centre Campus",org:"Meridian Data Centres (client RFP)",lines:["Engineering","Security"],value:"S$3–5m",close:"11 Dec 2026",days:32,rel:79,status:"New",type:"RFP"},
 {id:"T-2614",src:"Ariba",title:"Managing Agent Services — Riverview Residences (mixed-use, 820 units)",org:"Riverview MCST",lines:["Managing Agent"],value:"S$0.5–1m",close:"30 Nov 2026",days:21,rel:76,status:"Routed",type:"RFQ"},
 {id:"T-2615",src:"GeBIZ",title:"Term Contract for Grass Cutting and Landscape Maintenance — Western Parks",org:"Public agency (parks)",lines:["Environmental"],value:"S$1–2m",close:"18 Nov 2026",days:9,rel:41,status:"Parked",type:"ITT"},
 {id:"T-2617",src:"GeBIZ",title:"Supply and Installation of Office Furniture",org:"Public agency",lines:[],value:"S$0.2–0.4m",close:"15 Nov 2026",days:6,rel:8,status:"Parked",type:"ITQ"}],
summary:[
 {k:"Scope",v:"Integrated FM for a 14-building campus: M&E maintenance, cleaning, security, landscape coordination and a 24/7 helpdesk with a computerised maintenance management system.",p:3},
 {k:"Contract period",v:"3 years from 1 Apr 2027 with a 2-year extension option at the agency's discretion.",p:4},
 {k:"Eligibility",v:"BCA registration ME04 (or equivalent) and FM03; security services under a PLRD-licensed entity; ISO 41001 preferred; two similar contracts of at least S$3m in the last five years.",p:7},
 {k:"Submission",v:"Closes 27 Nov 2026, 4.00 pm via GeBIZ. Price schedule in Annex C format; technical proposal limited to 60 pages.",p:12},
 {k:"Compliance obligations",v:"Progressive Wage Model for cleaners and security officers; bizSAFE Level 3; monthly KPI reporting with deductions for shortfalls.",p:15},
 {k:"Evaluation",v:"Price-quality method: quality 60% (methodology, manpower, technology, track record) and price 40%.",p:18},
 {k:"Commercial risks",v:"Liquidated damages of 0.1% of annual contract value per day for critical outages; KPI deductions capped at 5% per month; 90-day payment terms.",p:22}],
reqs:[
 {id:"R1",t:"24/7 security coverage with at least 12 licensed officers per shift across 3 gatehouses",cat:"Security",p:15,c:.96,own:"Security",st:"Confirmed",src:"“The Contractor shall deploy not fewer than twelve (12) licensed security officers per shift, covering three (3) gatehouses and patrol routes, twenty-four hours a day.”"},
 {id:"R2",t:"Monthly cleaning audit score of 90% or above using the agency's audit template",cat:"Cleaning",p:16,c:.93,own:"Cleaning",st:"Confirmed",src:"“Cleaning performance shall be audited monthly; a score below ninety percent (90%) shall attract the deductions in Schedule D.”"},
 {id:"R3",t:"Critical M&E fault response within 30 minutes, rectification within 4 hours",cat:"Engineering",p:14,c:.91,own:"Engineering",st:"Confirmed",src:"“Critical faults: attendance within thirty (30) minutes and rectification or safe isolation within four (4) hours.”"},
 {id:"R4",t:"bizSAFE Level 3 (or STAR) certification at time of submission",cat:"Compliance",p:9,c:.98,own:"QHSE",st:"Confirmed",src:"“Tenderers shall hold a valid bizSAFE Level 3 certificate or higher at the closing date.”"},
 {id:"R5",t:"Mobilisation plan submitted within 14 days of award; full mobilisation by contract start",cat:"Mobilisation",p:20,c:.88,own:"Operations",st:"Review",src:"“A detailed mobilisation plan shall be submitted within fourteen (14) days of the Letter of Acceptance.”"},
 {id:"R6",t:"Computerised maintenance management system with client portal and mobile work orders",cat:"Technology",p:17,c:.90,own:"Digital",st:"Confirmed",src:"“The Contractor shall provide a CMMS accessible by the Authority's officers, including work-order tracking on mobile devices.”"},
 {id:"R7",t:"Liquidated damages: 0.1% of annual contract value per day of critical outage",cat:"Commercial",p:22,c:.85,own:"Commercial",st:"Review",src:"“Liquidated damages shall be levied at 0.1% of the annual contract sum for each day of critical service outage.”"},
 {id:"R8",t:"Two similar contracts of at least S$3m each completed in the last five years",cat:"Eligibility",p:8,c:.94,own:"BD",st:"Confirmed",src:"“Tenderers shall demonstrate completion of at least two (2) contracts of similar scope, each of value not less than S$3,000,000, within the last five (5) years.”"}],
tasks:[{who:"Engineering lead · K. Tan",due:"17 Nov",st:"Done"},{who:"Security lead · R. Menon",due:"17 Nov",st:"Overdue"},{who:"Cleaning lead · S. Ho",due:"18 Nov",st:"In progress"},{who:"Estimating · J. Lim",due:"21 Nov",st:"Not started"},{who:"Commercial & legal · A. Chua",due:"20 Nov",st:"Pending"}],
vault:[
 {t:"Security operations methodology — campus deployment v4",type:"Methodology",used:"Jun 2026",fresh:"Current",uses:7,match:91},
 {t:"Credential: polytechnic campus IFM contract 2021–2024",type:"Credential",used:"Aug 2026",fresh:"Current",uses:11,match:94},
 {t:"Manpower deployment plan template (security + cleaning)",type:"Template",used:"Sep 2026",fresh:"Current",uses:15,match:88},
 {t:"CMMS and client portal capability statement",type:"Credential",used:"Mar 2025",fresh:"Refresh suggested — 20 months old",uses:9,match:86},
 {t:"Pricing rationale: campus IFM 2024 (lost on price, 6% above winner)",type:"Pricing rationale",used:"Oct 2024",fresh:"Reference only",uses:3,match:80},
 {t:"Lessons learnt: hospital M&E bid 2023 — KPI deductions underestimated",type:"Lessons learnt",used:"Feb 2024",fresh:"Reference only",uses:2,match:74},
 {t:"Mobilisation plan — 14-building campus (2021)",type:"Case study",used:"May 2026",fresh:"Current",uses:5,match:83}],
quotes:[{v:"Vendor A (lift maintenance)",amt:"S$186,000 / yr",items:"12 of 12",flags:[],st:"Complete"},{v:"Vendor B (lift maintenance)",amt:"S$172,000 / yr",items:"10 of 12",flags:["24/7 call-out not priced","Excludes statutory inspection"],st:"Scope gap"},{v:"Vendor C (lift maintenance)",amt:"—",items:"—",flags:["No quotation received; 2 follow-ups sent"],st:"Chasing"}],
checks:[["Formula integrity across 6 sheets","Pass"],["Section subtotals vs summary tab","Flag: summary tab differs by S$12,400"],["Quantities vs manpower plan","Pass"],["Rates vs last three similar bids","Flag: cleaning supervisor rate 9% below the rate used in the last three bids"],["Client price breakdown column mapping","9 of 9 columns mapped"],["Annual escalation applied","Pass"]],
outcomes:[{t:"IFM — education campus (2024)",res:"Lost",rank:"2nd on price",fb:"Price 6% above winner; quality 1st"},{t:"Security — commercial portfolio (2025)",res:"Won",rank:"1st",fb:"Strong technology proposal"},{t:"M&E — hospital (2023)",res:"Lost",rank:"3rd",fb:"KPI deductions underestimated"},{t:"Managing agent — MCST (2025)",res:"Won",rank:"1st",fb:"Track record decisive"},{t:"Cleaning — public buildings (2026)",res:"Won",rank:"2nd on price",fb:"Quality scored highest"},{t:"IFM — transport depot (2026)",res:"Lost",rank:"4th",fb:"Capacity concerns raised"}]};

const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),2600)}
function go(v){S.view=v;closeDrawer();render()}
function closeDrawer(){$("drawer").classList.remove("open")}
function drawer(html){$("drawer").innerHTML='<button class="x" onclick="closeDrawer()">×</button>'+html;$("drawer").classList.add("open")}
function relColor(r){return r>=75?"var(--teal)":r>=50?"var(--amber)":"var(--red)"}
function bars(data,max,color){const w=100/data.length;return `<svg viewBox="0 0 100 44" style="width:100%;height:150px">${data.map((d,i)=>`<rect x="${i*w+w*0.18}" y="${40-36*d.v/max}" width="${w*0.64}" height="${36*d.v/max}" rx="1" fill="${color||'#0E7C86'}"/><text x="${i*w+w/2}" y="43.5" font-size="2.6" text-anchor="middle" fill="#5B6B7A">${d.l}</text>`).join("")}</svg>`}

const NAV=[["home","Dashboard","◉"],["radar","Tender Radar","⌖"],["ws","Tender workspace","▤"],["vault","Knowledge Vault","▣"],["post","Post-bid review","↻"],["settings","Criteria & routing","⚙"]];
function nav(){$("nav").innerHTML=NAV.map(([k,l,i])=>`<button class="nav ${S.view===k?'on':''}" onclick="go('${k}')"><span class="ic">${i}</span>${l}${k==='radar'?`<span class="cnt">${S.tenders.filter(t=>t.status==='New').length} new</span>`:k==='ws'?`<span class="cnt">${S.tasks.filter(t=>t.st==='Overdue').length}</span>`:''}</button>`).join("")}

function home(){const T=S.tenders;return `<div class="top"><div><h1>Good morning, Jason</h1><div class="sub">Monday 9 Nov 2026 · all tenders, clients and figures on this demo are synthetic</div></div><button class="btn ghost" onclick="go('radar')">Open the pipeline</button></div>
 <div class="tiles"><div class="tile"><div class="k">New opportunities this week</div><div class="v">14</div><div class="d">${T.filter(t=>t.rel>=75).length} relevant · ${T.filter(t=>t.status==='Parked').length} parked by the screen</div></div><div class="tile"><div class="k">Closing within 7 days</div><div class="v" style="color:#8C271D">${T.filter(t=>t.days<=7&&t.status!=='Parked').length+1}</div><div class="d">Deadline alerts sent to owners</div></div><div class="tile"><div class="k">Review tasks overdue</div><div class="v" style="color:#7A4E00">${S.tasks.filter(t=>t.st==='Overdue').length}</div><div class="d">Reminders escalate automatically</div></div><div class="tile"><div class="k">Hours saved this month (est.)</div><div class="v">46</div><div class="d">Monitoring, summaries, chasing</div></div></div>
 <div class="grid2"><div class="card"><h2>Needs you today</h2><table class="tbl"><tr><th>Item</th><th>Why</th><th></th></tr>
 <tr><td>Decide bid / no-bid · Northshore Polytechnic IFM</td><td>Relevance 92 · closes in 18 days · summary ready</td><td><button class="btn sm" onclick="openWs('T-2611','bid')">Open</button></td></tr>
 <tr><td>Corrigendum No. 1 · Northshore Polytechnic</td><td>4 changes affect manpower plan and pricing</td><td><button class="btn sm" onclick="openWs('T-2611','corr')">Open</button></td></tr>
 <tr><td>Security lead input overdue · Harbourfront portfolio</td><td>Due 17 Nov · 2 reminders sent</td><td><button class="btn sm" onclick="openWs('T-2611','review')">Open</button></td></tr>
 <tr><td>Vendor C quotation outstanding</td><td>Lift maintenance · follow-up sent twice</td><td><button class="btn sm" onclick="openWs('T-2611','rfq')">Open</button></td></tr></table></div>
 <div class="card"><h2>Opportunities by source (last 30 days)</h2>${bars([{l:"GeBIZ",v:31},{l:"SESAMi",v:9},{l:"TenderBoard",v:7},{l:"Ariba",v:4},{l:"Email/RFP",v:6}],35)}<div class="sm muted">GeBIZ via official feeds and open datasets; invitation portals via the monitored mailbox; client RFPs classified automatically</div></div></div>`}

function radar(){return `<div class="top"><div><h1>Tender Radar</h1><div class="sub">One pipeline across GeBIZ, SESAMi, TenderBoard, Ariba and client RFPs · ranked by relevance to CBM's service lines and bid history</div></div><div class="row"><select onchange="toast('Filter applied: '+this.value)"><option>All sources</option><option>GeBIZ</option><option>SESAMi</option><option>TenderBoard</option><option>Ariba</option><option>Email / RFP</option></select><button class="btn ghost" onclick="toast('Opportunity created from uploaded tender pack (ZIP) · reading in progress')">Upload a tender pack</button></div></div>
 <div class="card"><table class="tbl"><tr><th>Source</th><th>Opportunity</th><th>Service lines</th><th>Value band</th><th>Closes</th><th>Relevance</th><th>Status</th></tr>${S.tenders.map(t=>`<tr class="cl" onclick="openWs('${t.id}','summary')"><td><span class="src ${t.src}">${t.src}</span><div class="sm muted">${t.type}</div></td><td><b>${t.title}</b><div class="sm muted">${t.org} · ${t.id}</div></td><td>${t.lines.length?t.lines.map(l=>`<span class="chip navy" style="margin:1px 2px 1px 0">${l}</span>`).join(""):'<span class="muted">none matched</span>'}</td><td>${t.value}</td><td>${t.close}<div class="sm ${t.days<=7?'bad':'muted'}">${t.days} days</div></td><td><div class="bar" style="width:90px"><i style="width:${t.rel}%;background:${relColor(t.rel)}"></i></div><span class="sm">${t.rel}</span></td><td><span class="chip ${t.status==='Parked'?'':t.status==='New'?'amber':'teal'}">${t.status}</span></td></tr>`).join("")}</table>
 <div class="legend"><span><i style="background:var(--teal)"></i>75+ pursue</span><span><i style="background:var(--amber)"></i>50–74 review</span><span><i style="background:var(--red)"></i>below 50 parked automatically (you can unpark)</span></div></div>
 <div class="note">Relevance combines service-line match, workhead and value band, keywords from CBM's criteria, and outcomes of similar past bids. Click a row to open the workspace.</div>`}

function openWs(id,tab){S.sel=id;S.tab=tab||"summary";S.view="ws";closeDrawer();render()}
function ws(){const t=S.tenders.find(x=>x.id===S.sel);const tabs=[["summary","Summary"],["reqs","Requirements matrix"],["bid","Bid / No-bid"],["review","Review workflow"],["compose","Proposal composer"],["corr","Corrigenda"],["rfq","RFQ & costing"]];
 const generic=t.id!=="T-2611";
 return `<div class="top"><div><span class="src ${t.src}">${t.src}</span> <span class="chip ${t.status==='Parked'?'':'teal'}">${S.decided||t.status}</span><h1 style="margin-top:6px">${t.title}</h1><div class="sub">${t.org} · ${t.value} · closes ${t.close} (${t.days} days) · ${t.id}</div></div><button class="btn ghost" onclick="go('radar')">Back to pipeline</button></div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join("")}</div>
 ${generic?`<div class="card"><p>This demo carries full detail for the Northshore Polytechnic tender only. Other rows show the pipeline record.</p><button class="btn" onclick="openWs('T-2611','summary')">Open the detailed example</button></div>`:({summary,reqs,bid,review,compose,corr,rfq})[S.tab]()}`}

function summary(){return `<div class="grid2">${S.summary.map(s=>`<div class="card"><h3>${s.k}<span class="cite" onclick="cite(${s.p})">p.${s.p}</span></h3><div>${s.v}</div></div>`).join("")}</div>
 <div class="note">Every line is produced by the Extractor → Evaluator → Verifier chain and carries the page it came from. Click a page tag to see the source text.</div>`}
function cite(p){const r=S.reqs.find(x=>x.p===p);drawer(`<span class="chip navy">Source · tender pack p.${p}</span><h2 style="margin:8px 0">Verified against the document</h2><div class="q">${r?r.src:'“…integrated facilities management services for the campus comprising fourteen (14) buildings, including mechanical and electrical maintenance, cleaning, security and helpdesk services…”'}<small>Northshore Polytechnic ITT · Section ${p<10?'II':p<20?'III':'IV'} · page ${p}</small></div><div class="sm muted">Verifier status: claim supported by source text · model version logged in the audit trail.</div>`)}
function reqs(){return `<div class="card"><table class="tbl"><tr><th>#</th><th>Requirement</th><th>Category</th><th>Source</th><th>Confidence</th><th>Owner</th><th>Status</th></tr>${S.reqs.map(r=>`<tr class="cl" onclick="openReq('${r.id}')"><td>${r.id}</td><td>${r.t}</td><td><span class="chip navy">${r.cat}</span></td><td><span class="cite">p.${r.p}</span></td><td><span class="chip ${r.c>=.9?'green':'amber'}">${r.c.toFixed(2)}</span></td><td>${r.own}</td><td><span class="chip ${r.st==='Confirmed'?'teal':'amber'}">${r.st}</span></td></tr>`).join("")}</table></div>
 <div class="row"><button class="btn ghost" onclick="toast('Requirements matrix exported to Excel')">Export matrix</button><span class="sm muted">${S.reqs.length} requirements · ${S.reqs.filter(r=>r.st==='Confirmed').length} confirmed by reviewers · low-confidence items are listed first for checking</span></div>`}
function openReq(id){const r=S.reqs.find(x=>x.id===id);drawer(`<span class="chip navy">${r.cat}</span> <span class="chip ${r.c>=.9?'green':'amber'}">confidence ${r.c.toFixed(2)}</span><h2 style="margin:8px 0">${r.id} · ${r.t}</h2><div class="q">${r.src}<small>Source: tender pack page ${r.p}</small></div>
 <h3>Owner response</h3><textarea rows="3" placeholder="How CBM meets this requirement…">${r.st==='Confirmed'?'Compliant — see methodology section 3.'+r.id.slice(1):''}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" onclick="S.reqs.find(x=>x.id==='${r.id}').st='Confirmed';render();closeDrawer();toast('${r.id} confirmed by ${r.own}')">Confirm</button><button class="btn ghost sm" onclick="toast('Flagged for clarification question to the agency')">Raise clarification</button></div>`)}

function bid(){const sc=[["Capability fit",88,"All three service lines in-house; CMMS available"],["Past performance",82,"Won a campus IFM contract (2021–24); lost a 2024 campus bid on price"],["Capacity",64,"Security: 34 officers available against 48 required at peak — recruitment or subcontract needed"],["Commercial risk",58,"LDs at 0.1%/day and KPI deductions up to 5%/month; 90-day payment terms"],["Strategic value",90,"Anchor education-sector reference; extension option"]];
 const overall=Math.round(sc.reduce((a,s)=>a+s[1],0)/sc.length);
 return `<div class="grid2"><div class="card"><div class="row" style="gap:18px"><div class="ring" style="background:${overall>=75?'var(--teal)':overall>=55?'var(--amber)':'var(--red)'}">${overall}</div><div><h2 style="margin:0">Recommendation: Bid with caveats</h2><div class="sm muted">Score calibrated on CBM's own outcomes · explainable · you decide</div></div></div>
 ${sc.map(s=>`<div class="score"><span>${s[0]}</span><div class="bar"><i style="width:${s[1]}%;background:${relColor(s[1])}"></i></div><b>${s[1]}</b></div>`).join("")}
 <h3 style="margin-top:12px">Why</h3>${sc.map(s=>`<div class="sm">• <b>${s[0]}:</b> ${s[2]}</div>`).join("")}
 <h3 style="margin-top:12px">Requirements that decided it</h3><div class="sm">R1 security manpower (capacity caveat) · R7 liquidated damages (commercial caveat) · R8 track record (met) · R4 bizSAFE (met)</div></div>
 <div class="card"><h2>Effort versus value</h2><table class="tbl"><tr><td>Estimated bid effort</td><td>~120 hours across BD, estimating, 3 service lines</td></tr><tr><td>Contract value (3 yrs)</td><td>S$8–12m</td></tr><tr><td>Win probability (history)</td><td>38% — similar education bids: 1 of 3 won</td></tr><tr><td>Routing suggestion</td><td>Engineering, Cleaning, Security leads; Estimating; Commercial</td></tr></table>
 <h3 style="margin-top:12px">Similar past bids</h3>${S.outcomes.slice(0,3).map(o=>`<div class="sm">• ${o.t} — <b class="${o.res==='Won'?'ok':'bad'}">${o.res}</b>, ${o.rank}; ${o.fb}</div>`).join("")}
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Your decision</h3><div class="row"><button class="btn" onclick="decide('Bid')">Bid</button><button class="btn amber" onclick="decide('Bid with caveats')">Bid with caveats</button><button class="btn warn" onclick="decide('No bid')">No bid</button></div>${S.decided?`<div class="note">Decision recorded: <b>${S.decided}</b> by Jason, 9 Nov 09:42 · routed to service lines · audit log updated</div>`:''}</div></div>`}
function decide(d){drawer(`<h2>${d} — add your assessment and route</h2><textarea rows="3" placeholder="Your assessment (stored with the decision)">${d==='No bid'?'':'Pursue; resolve security manpower via recruitment drive plus subcontract for peak; negotiate LD cap in clarifications.'}</textarea><h3 style="margin-top:12px">Route to</h3>${["Engineering lead","Cleaning lead","Security lead","Estimating","Commercial & legal"].map(r=>`<label class="sm" style="display:block;margin:4px 0"><input type="checkbox" checked style="width:auto;margin-right:6px">${r}</label>`).join("")}<button class="btn" style="margin-top:10px" onclick="S.decided='${d}';S.tab='review';closeDrawer();render();toast('${d} recorded · review tasks created with deadlines · Teams notifications sent')">Confirm and route</button>`)}
function review(){const done=S.tasks.filter(t=>t.st==='Done').length;return `<div class="card"><div class="row sp"><h2 style="margin:0">Cross-functional review · ${done} of ${S.tasks.length} complete</h2><span class="sm muted">Deadlines set back from the closing date · reminders automatic</span></div><div class="pb">${S.tasks.map(t=>`<i class="${t.st==='Done'?'on':t.st==='Overdue'?'w':''}"></i>`).join("")}</div>
 <table class="tbl"><tr><th>Reviewer</th><th>Input requested</th><th>Due</th><th>Status</th><th></th></tr>${S.tasks.map((t,i)=>`<tr><td><b>${t.who}</b></td><td class="sm">Structured template: approach, manpower, risks, cost drivers</td><td>${t.due}</td><td><span class="chip ${t.st==='Done'?'green':t.st==='Overdue'?'red':t.st==='In progress'?'teal':''}">${t.st}</span></td><td>${t.st==='Done'?'<span class="sm ok">Input received</span>':`<button class="btn sm ghost" onclick="remind(${i})">Send reminder</button>`}</td></tr>`).join("")}</table></div>
 <div class="note">Sarah sees completion in real time; non-responders are reminded automatically and escalated 5 days before closing. Inputs land in the consolidated assessment, not in email threads.</div>`}
function remind(i){const t=S.tasks[i];if(t.st==='Overdue'){t.st='In progress';toast('Reminder sent to '+t.who.split(' ·')[0]+' · escalation copied to BD manager')}else toast('Reminder sent to '+t.who.split(' ·')[0]);render()}
function compose(){const map={R1:[0,2],R2:[2],R3:[1],R4:[],R5:[6],R6:[3],R7:[4,5],R8:[1]};const covered=Object.values(map).filter(v=>v.length).length;
 return `<div class="card"><div class="row sp"><h2 style="margin:0">Compliance check · ${covered} of ${S.reqs.length} requirements covered by recommended content</h2><span class="chip amber">R4 needs a fresh bizSAFE certificate scan</span></div><div class="pb">${S.reqs.map(r=>`<i class="${map[r.id].length?'on':'w'}"></i>`).join("")}</div></div>
 ${S.reqs.map(r=>`<div class="card"><div class="row sp"><h3 style="margin:0">${r.id} · ${r.t}</h3><span class="chip navy">${r.cat}</span></div>${map[r.id].length?map[r.id].map(i=>{const v=S.vault[i];return `<div class="opt"><div class="row sp"><b>${v.t}</b><span class="chip ${v.fresh==='Current'?'green':'amber'}">${v.fresh}</span></div><div class="rs">${v.type} · last used ${v.used} · used ${v.uses}× · match ${v.match}%</div><div class="row"><button class="btn sm" onclick="toast('Block inserted into draft section ${r.id}')">Insert into draft</button><button class="btn sm ghost" onclick="toast('Opened in Knowledge Vault')">Open</button></div></div>`}).join(""):`<div class="ai"><div class="h">No reusable content — new content required</div>Suggested owner: QHSE. Attach the current bizSAFE Level 3 certificate and a one-paragraph statement of WSH management.</div>`}</div>`).join("")}`}
function corr(){return `<div class="card"><div class="row sp"><h2 style="margin:0">Corrigendum No. 1 · issued 10 Nov 2026</h2><span class="chip red">4 changes · 3 affect the draft</span></div><p class="sm muted">Compared clause-by-clause against the original tender pack. Affected proposal sections are flagged for update.</p>
 ${[["Clause 4.2 — Contract period","Three (3) years with a <del>two (2) year</del> extension option","Three (3) years with a <ins>one (1) + one (1) year</ins> extension option","Executive summary · Pricing schedule (escalation)"],["Clause 15.3 — Security manpower","not fewer than <del>twelve (12)</del> licensed security officers per shift","not fewer than <ins>fourteen (14)</ins> licensed security officers per shift","Manpower plan · Pricing schedule · Bid caveat (capacity)"],["Clause 1.6 — Closing date","Closes <del>27 Nov 2026</del>, 4.00 pm","Closes <ins>2 Dec 2026</ins>, 4.00 pm","Review workflow deadlines (recomputed)"],["Appendix F — Sustainability reporting","<del>(not present)</del>","<ins>New: quarterly energy and waste reporting using the Authority's template</ins>","Technology & reporting section (new content)"]].map(c=>`<div class="opt"><b>${c[0]}</b><div class="diff" style="margin-top:8px"><div class="o">${c[1]}</div><div class="n">${c[2]}</div></div><div class="rs">Affects: ${c[3]}</div></div>`).join("")}
 <button class="btn" onclick="toast('Requirements matrix updated · R1 reopened for Security lead · deadlines moved to 2 Dec')">Apply changes to matrix and tasks</button></div>`}
function rfq(){return `<div class="grid2"><div class="card"><h2>Vendor quotations — lift maintenance package</h2><table class="tbl"><tr><th>Vendor</th><th>Quoted</th><th>Items</th><th>Flags</th><th>Status</th></tr>${S.quotes.map(q=>`<tr><td><b>${q.v}</b></td><td>${q.amt}</td><td>${q.items}</td><td>${q.flags.length?q.flags.map(f=>`<span class="chip amber" style="margin:1px 2px 1px 0">${f}</span>`).join(""):'<span class="ok">none</span>'}</td><td><span class="chip ${q.st==='Complete'?'green':q.st==='Chasing'?'red':'amber'}">${q.st}</span></td></tr>`).join("")}</table><div class="row" style="margin-top:10px"><button class="btn sm" onclick="toast('Follow-up email sent to Vendor C from the RFQ record')">Chase Vendor C</button><button class="btn sm ghost" onclick="toast('RFQ pack generated from tender clauses 9–11 for 2 more vendors')">Generate RFQ pack</button></div><div class="note">Like-for-like comparison: quotations are extracted and lined up against the tender requirements, so a lower price with missing items is visible immediately.</div></div>
 <div class="card"><h2>Costing template verification · Annex C workbook</h2><table class="tbl"><tr><th>Check</th><th>Result</th></tr>${S.checks.map(c=>`<tr><td>${c[0]}</td><td class="${c[1].startsWith('Flag')?'bad':'ok'}">${c[1]}</td></tr>`).join("")}</table><div class="ai"><div class="h">Historical price estimate (no quotation yet)</div>Vendor C package estimated at S$178,000–184,000 per year from three comparable quotations (2024–2026), adjusted for scope. Use only as a placeholder until a quotation arrives.</div><button class="btn sm" onclick="toast('Flags sent to Estimating · workbook locked pending correction')">Send flags to Estimating</button></div></div>`}

function vault(){return `<div class="top"><div><h1>Knowledge Vault</h1><div class="sub">CBM's proposals, credentials, templates, pricing rationale and lessons learnt — private to CBM, retrieved by meaning, access by role</div></div><input style="width:300px" placeholder="Search e.g. 'security manpower campus'…" onchange="toast('Semantic search: '+this.value)"></div>
 <div class="card"><table class="tbl"><tr><th>Content</th><th>Type</th><th>Last used</th><th>Freshness</th><th>Used</th><th></th></tr>${S.vault.map(v=>`<tr><td><b>${v.t}</b></td><td><span class="chip navy">${v.type}</span></td><td>${v.used}</td><td><span class="chip ${v.fresh==='Current'?'green':'amber'}">${v.fresh}</span></td><td>${v.uses}×</td><td><button class="btn sm ghost" onclick="toast('Opened in SharePoint (Microsoft Graph)')">Open</button></td></tr>`).join("")}</table></div>
 <div class="note">Sources: SharePoint libraries and shared drives connected through Microsoft Graph; bulk upload with metadata capture. Nothing leaves CBM's tenancy.</div>`}
function post(){const win=S.outcomes.filter(o=>o.res==='Won').length;return `<div class="top"><div><h1>Post-bid review & learning</h1><div class="sub">Outcomes and evaluation feedback feed back into relevance scoring, bid qualification and content recommendations</div></div><button class="btn" onclick="toast('Scoring weights recalibrated on 6 outcomes · capacity weight raised')">Recalibrate scoring</button></div>
 <div class="tiles" style="grid-template-columns:repeat(3,1fr)"><div class="tile"><div class="k">Win rate (last 6 bids)</div><div class="v">${Math.round(win/S.outcomes.length*100)}%</div></div><div class="tile"><div class="k">Most common loss reason</div><div class="v" style="font-size:18px">Price position</div><div class="d">2 of 3 losses</div></div><div class="tile"><div class="k">Lessons captured</div><div class="v">11</div><div class="d">4 promoted into bid criteria</div></div></div>
 <div class="grid2"><div class="card"><h2>Outcomes</h2><table class="tbl"><tr><th>Bid</th><th>Result</th><th>Rank</th><th>Feedback</th></tr>${S.outcomes.map(o=>`<tr><td>${o.t}</td><td class="${o.res==='Won'?'ok':'bad'}">${o.res}</td><td>${o.rank}</td><td class="sm">${o.fb}</td></tr>`).join("")}</table></div><div class="card"><h2>Win rate by service line (%)</h2>${bars([{l:"Security",v:67},{l:"Cleaning",v:60},{l:"Engineering",v:40},{l:"IFM",v:33},{l:"Mgmt agent",v:75}],100)}<h3 style="margin-top:10px">Capture an outcome</h3><div class="row"><select><option>Northshore Polytechnic IFM</option></select><select><option>Won</option><option>Lost</option><option>Withdrawn</option></select><button class="btn sm" onclick="toast('Outcome and lessons recorded · model will recalibrate')">Record</button></div></div></div>`}
function settings(){return `<div class="top"><div><h1>Criteria & routing</h1><div class="sub">Business rules are configuration — CBM's team adjusts weights, keywords and routing without a developer</div></div></div>
 <div class="grid2"><div class="card"><h2>Relevance and bid-score weights</h2>${[["Service-line match",30],["Value band & workhead",20],["Past performance",20],["Capacity",15],["Commercial risk",15]].map(w=>`<div class="score"><span>${w[0]}</span><div class="bar"><i style="width:${w[1]*2.5}%"></i></div><b>${w[1]}%</b></div>`).join("")}<button class="btn sm ghost" style="margin-top:8px" onclick="toast('Weights saved · versioned in the audit log')">Save weights</button></div>
 <div class="card"><h2>Routing map</h2><table class="tbl"><tr><th>Service scope detected</th><th>Routed to</th></tr><tr><td>Security</td><td>Security lead, Estimating</td></tr><tr><td>Cleaning / environmental</td><td>Cleaning lead, Estimating</td></tr><tr><td>M&E / engineering</td><td>Engineering lead, Estimating</td></tr><tr><td>Managing agent</td><td>Managing Agent lead</td></tr><tr><td>Any value above S$5m</td><td>+ Commercial & legal, Management approval</td></tr></table><h2 style="margin-top:14px">Roles</h2><div class="sm">BD executive (pipeline, reader, decisions) · Service-line reviewer (own tasks) · Estimating (RFQ & costing) · Proposal lead (composer, vault) · Management (dashboard, approvals). Entra ID single sign-on; every action audited.</div></div></div>`}

function render(){nav();const V={home,radar,ws,vault,post,settings};$("view").innerHTML=V[S.view]();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
